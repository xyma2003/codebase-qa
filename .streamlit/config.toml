# Disable file watcher to suppress noisy torchvision warnings during startup.
# Streamlit scans all installed modules (including transformers'
# image_processing_*) which raises ModuleNotFoundError for torchvision —
# harmless noise since this project uses text embeddings (all-MiniLM-L6-v2).
[server]
fileWatcherType = "none"
address = "127.0.0.1"
enableXsrfProtection = true
enableCORS = true
maxMessageSize = 2

[browser]
gatherUsageStats = false
