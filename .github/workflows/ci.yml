name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  offline-checks:
    runs-on: macos-15
    timeout-minutes: 25
    defaults:
      run:
        shell: bash
    env:
      OPENAI_API_KEY: ""
      ANTHROPIC_API_KEY: ""
      OPENAI_API_BASE: https://api.siliconflow.cn/v1
      OPENAI_MODEL: Qwen/Qwen3-32B
      HF_HUB_OFFLINE: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.12.3"
          python-version: "3.12.13"
          activate-environment: true
          enable-cache: true
          cache-dependency-glob: docs/baseline/runs/20261110-stage0/requirements-hashed.txt
      - name: Install recorded dependencies
        run: |
          mkdir -p "$RUNNER_TEMP/check-records"
          uv pip install --require-hashes -r docs/baseline/runs/20261110-stage0/requirements-hashed.txt
          uv pip check
          uv pip freeze > "$RUNNER_TEMP/check-records/requirements.txt"
      - name: Verify frozen development data
        run: python scripts/check_evaluation.py --output "$RUNNER_TEMP/check-records/dataset.json"
      - name: Run offline tests
        env:
          HF_HOME: ${{ runner.temp }}/huggingface-offline
        run: python -m unittest discover -s tests -v 2>&1 | tee "$RUNNER_TEMP/check-records/unittest.log"
      - name: Read back published provider fixture
        run: |
          python -m zipfile -e docs/checks/20261112-provider-evaluation-local.zip "$RUNNER_TEMP/provider-fixture"
          python scripts/verify_evaluation_archive.py "$RUNNER_TEMP/provider-fixture" > "$RUNNER_TEMP/check-records/archive.json"
      - name: Keep check records
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: offline-check-records
          retention-days: 14
          if-no-files-found: warn
          path: ${{ runner.temp }}/check-records/
