name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  offline-checks:
    runs-on: macos-15
    timeout-minutes: 25
    defaults:
      run:
        shell: bash
    env:
      OPENAI_API_KEY: ""
      ANTHROPIC_API_KEY: ""
      OPENAI_API_BASE: https://api.siliconflow.cn/v1
      OPENAI_MODEL: Qwen/Qwen3-32B
      HF_HUB_OFFLINE: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.12.3"
          python-version: "3.12.13"
          activate-environment: true
          enable-cache: true
          cache-dependency-glob: dependencies/runtime-macos.lock
      - name: Install current locked dependencies
        run: |
          mkdir -p "$RUNNER_TEMP/check-records"
          uv pip sync --require-hashes dependencies/runtime-macos.lock
          uv pip check
          python -c 'import importlib.util; from ops.dependency_audit import check_installed; differences=check_installed("dependencies/runtime-macos.lock",strict=True); assert not differences,differences; assert importlib.util.find_spec("chromadb") is None'
          uv pip freeze > "$RUNNER_TEMP/check-records/requirements.txt"
      - name: Verify frozen development data
        run: python scripts/check_evaluation.py --output "$RUNNER_TEMP/check-records/dataset.json"
      - name: Check forced prompt attack boundaries
        run: python scripts/check_prompt_attacks.py --output "$RUNNER_TEMP/check-records/prompt-attacks.json"
      - name: Run offline tests
        env:
          HF_HOME: ${{ runner.temp }}/huggingface-offline
        run: python -m unittest discover -s tests -v 2>&1 | tee "$RUNNER_TEMP/check-records/unittest.log"
      - name: Read back published provider fixture
        run: |
          python -m zipfile -e docs/checks/20261112-provider-evaluation-local.zip "$RUNNER_TEMP/provider-fixture"
          python scripts/verify_evaluation_archive.py "$RUNNER_TEMP/provider-fixture" > "$RUNNER_TEMP/check-records/archive.json"
      - name: Exercise stopped-service backup and restore
        run: python scripts/check_restore.py --output "$RUNNER_TEMP/restore-drill"
      - name: Keep check records
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: offline-check-records
          retention-days: 14
          if-no-files-found: warn
          path: |
            ${{ runner.temp }}/check-records/
            ${{ runner.temp }}/restore-drill/report.json
            ${{ runner.temp }}/restore-drill/seed.log
            ${{ runner.temp }}/restore-drill/verify.log
  linux-deployment-preparation:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    defaults:
      run:
        shell: bash
    env:
      OPENAI_API_KEY: ""
      ANTHROPIC_API_KEY: ""
      UV_HTTP_RETRIES: "0"
      UV_HTTP_TIMEOUT: "30"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.12.3"
          python-version: "3.12.13"
          enable-cache: false
      - name: Reuse verified Linux CPU lock
        run: |
          mkdir -p "$RUNNER_TEMP/deployment-records"
          cp dependencies/runtime-linux-cpu.lock deploy/runtime.lock
          python -c 'import hashlib,json,pathlib; expected=json.loads(pathlib.Path("deploy/storage-compatibility.json").read_text())["linux_lock_sha256"]; assert hashlib.sha256(pathlib.Path("deploy/runtime.lock").read_bytes()).hexdigest()==expected'
          python scripts/verify_linux_lock.py deploy/runtime.lock --output "$RUNNER_TEMP/deployment-records/platform.json"
          cp deploy/runtime.lock "$RUNNER_TEMP/deployment-records/runtime.lock"
      - name: Inspect immutable base images
        run: |
          python_image=$(python -c 'import json; print(json.load(open("deploy/runtime-layout.json"))["python_image"])')
          docker pull "$python_image"
          uv_image=$(python -c 'import json; print(json.load(open("deploy/storage-compatibility.json"))["uv_image"])')
          nginx_image=$(python -c 'import json; print(json.load(open("deploy/storage-compatibility.json"))["proxy_image"])')
          docker pull "$uv_image"
          docker pull "$nginx_image"
          docker image inspect "$python_image" "$uv_image" "$nginx_image" > "$RUNNER_TEMP/deployment-records/base-images.json"
      - name: Build preparation image without secrets or business data
        run: |
          python_image=$(python -c 'import json; print(json.load(open("deploy/runtime-layout.json"))["python_image"])')
          uv_image=$(python -c 'import json; print(json.load(open("deploy/storage-compatibility.json"))["uv_image"])')
          docker build -f deploy/Dockerfile --build-arg "PYTHON_IMAGE=$python_image" --build-arg "UV_IMAGE=$uv_image" --build-arg "CODEBASE_REVISION=$GITHUB_SHA" -t codebase-qa:preparation .
          docker image inspect codebase-qa:preparation > "$RUNNER_TEMP/deployment-records/application-image.json"
          docker run --rm --entrypoint python codebase-qa:preparation -c 'import torch,sqlite3,pydantic_ai,streamlit,importlib.util; assert torch.version.cuda is None; assert importlib.util.find_spec("chromadb") is None'
          docker run --rm --entrypoint python codebase-qa:preparation -c 'from ops.dependency_audit import check_installed; differences=check_installed("deploy/runtime.lock",strict=True); assert not differences,differences; print("all_installed_packages_match_audited_lock")'
          docker run --rm --entrypoint dpkg-query codebase-qa:preparation -W > "$RUNNER_TEMP/deployment-records/os-packages.txt"
          docker run --rm --entrypoint cat codebase-qa:preparation /app/deploy/os-package-check.json > "$RUNNER_TEMP/deployment-records/os-package-minimums.json"
          docker run --rm --entrypoint cat codebase-qa:preparation /app/deploy/os-package-build-check.json > "$RUNNER_TEMP/deployment-records/os-package-build-minimums.json"
          docker run --rm --read-only --network none --tmpfs /tmp --cap-drop ALL --security-opt no-new-privileges --entrypoint python codebase-qa:preparation -m ops.runtime_layout > "$RUNNER_TEMP/deployment-records/runtime-layout.json"
          docker run --rm --read-only --network none --tmpfs /tmp --cap-drop ALL --security-opt no-new-privileges --entrypoint python codebase-qa:preparation -m ops.optional_parsers --runtime > "$RUNNER_TEMP/deployment-records/optional-parser-probes.json"
          docker run --rm --read-only --network none --tmpfs /tmp --cap-drop ALL --security-opt no-new-privileges --entrypoint python codebase-qa:preparation -m ops.sqlite_security_check > "$RUNNER_TEMP/deployment-records/sqlite-security-probes.json"
      - name: Collect advisories and record release block separately from smoke checks
        run: |
          python scripts/audit_dependencies.py --lock deploy/runtime.lock --collect-only --output "$RUNNER_TEMP/deployment-records/osv"
          python -c 'import json,os,pathlib; r=json.loads((pathlib.Path(os.environ["RUNNER_TEMP"])/"deployment-records/osv/audit.json").read_text()); print("python_dependency_gate_clear:",r["complete"] and not r["findings"]); open(os.environ["GITHUB_STEP_SUMMARY"],"a").write("\nPython dependency collection complete. Python gate clear: " + str(r["complete"] and not r["findings"]) + ". OS audit and real acceptance are checked separately.\n")'
      - name: Check Compose shape, TLS proxy, WebSocket, rate limit and non-root image
        run: |
          CODEBASE_QA_IMAGE=codebase-qa:preparation CODEBASE_QA_IMAGE_ID=sha256:fixture NGINX_IMAGE=nginx:1.30.6-alpine CODEBASE_QA_PUBLIC_ORIGIN=https://qa.example.invalid CONFIG_DIR=/tmp/qa-config STATE_DIR=/tmp/qa-state TLS_DIR=/tmp/qa-tls MODEL_CACHE_DIR=/tmp/qa-model EVALUATION_REPOSITORY=/tmp/qa-eval docker compose -f deploy/compose.yaml config --quiet
          nginx_image=$(python -c 'import json; print(json.load(open("deploy/storage-compatibility.json"))["proxy_image"])')
          python scripts/check_container.py codebase-qa:preparation "$nginx_image" "$RUNNER_TEMP/deployment-records/smoke"
      - name: Read baseline storage on the new image and exercise restore
        run: |
          baseline_revision=$(python -c 'import json; print(json.load(open("deploy/storage-compatibility.json"))["baseline_revision"])')
          baseline_python=$(python -c 'import json; print(json.load(open("deploy/storage-compatibility.json"))["python_image"])')
          baseline_uv=$(python -c 'import json; print(json.load(open("deploy/storage-compatibility.json"))["uv_image"])')
          mkdir "$RUNNER_TEMP/baseline-source"
          git archive "$baseline_revision" | tar -x -f - -C "$RUNNER_TEMP/baseline-source"
          baseline_lock=$(python -c 'import json; print(json.load(open("deploy/storage-compatibility.json"))["baseline_linux_lock"])')
          python -c 'import hashlib,json,pathlib; m=json.loads(pathlib.Path("deploy/storage-compatibility.json").read_text()); assert hashlib.sha256(pathlib.Path(m["baseline_linux_lock"]).read_bytes()).hexdigest()==m["baseline_linux_lock_sha256"]'
          cp "$baseline_lock" "$RUNNER_TEMP/baseline-source/deploy/runtime.lock"
          docker build -f "$RUNNER_TEMP/baseline-source/deploy/Dockerfile" --build-arg "PYTHON_IMAGE=$baseline_python" --build-arg "UV_IMAGE=$baseline_uv" --build-arg "CODEBASE_REVISION=$baseline_revision" -t codebase-qa:storage-baseline "$RUNNER_TEMP/baseline-source"
          docker image inspect codebase-qa:storage-baseline > "$RUNNER_TEMP/deployment-records/storage-baseline-image.json"
          python scripts/check_storage_platform.py codebase-qa:storage-baseline codebase-qa:preparation --output "$RUNNER_TEMP/deployment-records/storage-compatibility"
          docker image rm codebase-qa:storage-baseline
      - name: Build controlled security comparison baseline
        run: |
          baseline_revision=$(python -c 'import json; print(json.load(open("deploy/runtime-layout.json"))["baseline_revision"])')
          python_image=$(python -c 'import json; print(json.load(open("deploy/runtime-layout.json"))["python_image"])')
          uv_image=$(python -c 'import json; print(json.load(open("deploy/storage-compatibility.json"))["uv_image"])')
          mkdir "$RUNNER_TEMP/security-baseline-source"
          git archive "$baseline_revision" | tar -x -f - -C "$RUNNER_TEMP/security-baseline-source"
          cp dependencies/runtime-linux-cpu.lock "$RUNNER_TEMP/security-baseline-source/deploy/runtime.lock"
          docker build -f "$RUNNER_TEMP/security-baseline-source/deploy/Dockerfile" --build-arg "PYTHON_IMAGE=$python_image" --build-arg "UV_IMAGE=$uv_image" --build-arg "CODEBASE_REVISION=$baseline_revision" -t codebase-qa:security-baseline "$RUNNER_TEMP/security-baseline-source"
          docker image inspect codebase-qa:security-baseline > "$RUNNER_TEMP/deployment-records/security-baseline-image.json"
      - name: Compare OS advisories using the same database without Docker socket access
        run: |
          trivy_image=$(python -c 'import json; print(json.load(open("deploy/storage-compatibility.json"))["scanner_image"])')
          docker pull "$trivy_image"
          docker image inspect "$trivy_image" > "$RUNNER_TEMP/deployment-records/scanner-image.json"
          mkdir "$RUNNER_TEMP/trivy-cache"
          docker save codebase-qa:security-baseline -o "$RUNNER_TEMP/container-image.tar"
          docker run --rm --user "$(id -u):$(id -g)" --cap-drop ALL --security-opt no-new-privileges --memory 2g --cpus 2 -e TRIVY_CACHE_DIR=/cache -v "$RUNNER_TEMP/trivy-cache:/cache" -v "$RUNNER_TEMP/container-image.tar:/input/image.tar:ro" -v "$RUNNER_TEMP/deployment-records:/records" "$trivy_image" image --input /input/image.tar --scanners vuln --pkg-types os --format json --output /records/baseline-os-raw.json --exit-code 0
          sha256sum "$RUNNER_TEMP/trivy-cache/db/trivy.db" > "$RUNNER_TEMP/deployment-records/scanner-db.sha256"
          rm "$RUNNER_TEMP/container-image.tar"
          docker image rm codebase-qa:security-baseline
          docker save codebase-qa:preparation -o "$RUNNER_TEMP/container-image.tar"
          docker run --rm --user "$(id -u):$(id -g)" --cap-drop ALL --security-opt no-new-privileges --memory 2g --cpus 2 -e TRIVY_CACHE_DIR=/cache -v "$RUNNER_TEMP/trivy-cache:/cache" -v "$RUNNER_TEMP/container-image.tar:/input/image.tar:ro" -v "$RUNNER_TEMP/deployment-records:/records" "$trivy_image" image --input /input/image.tar --skip-db-update --scanners vuln --pkg-types os --format json --output /records/os-raw.json --exit-code 0
          sha256sum --check "$RUNNER_TEMP/deployment-records/scanner-db.sha256"
          python scripts/compare_os_images.py "$RUNNER_TEMP/deployment-records/baseline-os-raw.json" "$RUNNER_TEMP/deployment-records/os-raw.json" --output "$RUNNER_TEMP/deployment-records/image-comparison.json"
          image_id=$(docker image inspect --format '{{.Id}}' codebase-qa:preparation)
          python scripts/package_os_audit.py "$RUNNER_TEMP/deployment-records/os-raw.json" --lock deploy/runtime.lock --revision "$GITHUB_SHA" --image-id "$image_id" --output "$RUNNER_TEMP/deployment-records/os-audit.json"
          python -m ops.os_packages --scan "$RUNNER_TEMP/deployment-records/os-raw.json" --output "$RUNNER_TEMP/deployment-records/os-remediation.json"
          python scripts/triage_os_audit.py "$RUNNER_TEMP/deployment-records/os-raw.json" --output "$RUNNER_TEMP/deployment-records/risk-review"
          rm "$RUNNER_TEMP/container-image.tar"
      - name: Keep preparation evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: linux-deployment-preparation
          retention-days: 14
          if-no-files-found: warn
          path: ${{ runner.temp }}/deployment-records/
